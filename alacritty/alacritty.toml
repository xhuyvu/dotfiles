# ==========================================
# Minimal Alacritty Configuration
# Font: Fira Code | Padding | Transparency
# ==========================================

[window]
# Adds breathing room inside the terminal window (width, height)
padding = { x = 12, y = 12 }

# Window opacity (0.0 = completely invisible, 1.0 = fully opaque)
opacity = 0.85

# Blur the background behind the window (macOS and some Linux window managers)
blur = true

[font]
size = 8.0

# Define font styles using Fira Code
[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"
